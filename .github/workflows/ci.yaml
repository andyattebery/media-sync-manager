---
name: ci

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[test]"
      - run: pytest tests/ -v

  # Separate job so a browser-install failure can never redden the unit-test signal.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ".[web,test,e2e]"
      - run: playwright install --with-deps chromium
      # `-m e2e`, NOT `pytest tests/e2e`: the default addopts is `-m 'not e2e'`, so a path-based
      # invocation would collect the directory and deselect every test in it — a green job that
      # ran nothing. Fail explicitly if the selection is empty.
      - run: pytest -m e2e -v

  docker:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Compute version
        id: version
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ github.ref_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (versioned)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/andyattebery/media-sync-manager:${{ steps.version.outputs.version }}
      - name: Promote :latest
        if: steps.version.outputs.is_release == 'true'
        run: |
          docker buildx imagetools create \
            -t ghcr.io/andyattebery/media-sync-manager:latest \
            ghcr.io/andyattebery/media-sync-manager:${VERSION}
        env:
          VERSION: ${{ steps.version.outputs.version }}
