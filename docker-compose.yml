services:
  media-sync-manager:
    build: .
    image: ghcr.io/andyattebery/media-sync-manager:latest
    restart: unless-stopped
    volumes:
      - /etc/media-sync-manager/config.yaml:/etc/media-sync-manager/config.yaml:ro
      # Same mount Jellyfin & Tdarr use, so all three agree on /media/... paths (no path maps) and
      # media_root + transcode_root are on one filesystem (hardlinks work). transcode_root lives at
      # /media/Transcode Videos (= /mnt/storage/Transcode Videos on the host).
      - /mnt/storage:/media
