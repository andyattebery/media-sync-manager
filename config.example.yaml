# Keep transcode_root UNDER media_root (as below). The glue creates an input in transcode_root
# pointing at each original; when those are symlinks they are relative, and a relative link between
# two sibling roots resolves outside an SMB share — where Samba's default `wide links = no` hides the
# file from Tdarr entirely rather than showing a broken link. `doctor` checks this.
#
# Deployment note: /mnt/storage is bind-mounted to /media in the Jellyfin & Tdarr containers. Run
# this glue container with the SAME mount (-  /mnt/storage:/media), so all three agree on /media/...
# paths and no path maps are needed. Run it where that filesystem is LOCAL: creating a symlink over
# CIFS/SMB fails (the protocol has no symlink-create operation).

media_root: /media                              # covers /media/Movies, /media/TV Shows, /media/Kids *
transcode_root: /media/Transcode Videos         # inputs + sync/ outputs; keep under media_root
poll_interval_seconds: 45

# How inputs are created. Leave unset: `auto` probes the filesystem once at startup and reports the
# result in `doctor`, because the right answer depends on union/branch behaviour no operator should
# have to reason about. Set it explicitly only if you want a hard failure instead of a fallback.
# input_mode: auto                              # auto | hardlink | symlink

jellyfin:
  url: http://jellyfin.example.com:8096
  api_key: "${JELLYFIN_API_KEY}"      # env-expanded; commit-safe YAML
  user_id: "a1b2c3..."                # REQUIRED by the playlist-items endpoint

tdarr:
  url: http://tdarr.example.com:8265
  username: "${TDARR_USER}"           # omit username+password if the instance has auth disabled
  password: "${TDARR_PASS}"
  request_timeout_seconds: 20

# Each target = one device: a name (keys the dirs), a Tdarr library, and its playlist->segment pairs.
# Derived per (target, segment):
#   input   <transcode_root>/<name>/<segment>/<source_rel>
#   output  <transcode_root>/<name>/sync/<segment>/<source_rel>   (Tdarr's flow writes here)
# Which playlist you drop an item into decides its segment (transcode flow).
targets:
  - name: iphone
    library_id: lib_iphone
    playlists:
      - { playlist: "2D Animation", segment: animation }
      - { playlist: "Standard",     segment: standard }
      # per-playlist override if you use one Tdarr library per segment:
      # - { playlist: "Standard", segment: standard, library_id: lib_iphone_standard }

# A second device is just another target with a different name:
#   - name: ipad
#     library_id: lib_ipad
#     playlists:
#       - { playlist: "iPad 2D Animation", segment: animation }
#       - { playlist: "iPad Standard",     segment: standard }

# Optional path maps — only if the glue sees a folder at a different path than Jellyfin/Tdarr do
# (mismatched container mounts). Each entry is anchored on the glue's `local` path:
# path_maps:       [ { local: /media, jellyfin: /data/media } ]   # jellyfin path -> local, on the way in
# tdarr_path_maps: [ { local: /media, tdarr: /mnt/tdarr } ]       # local -> tdarr path, on the way out

# The playlist editor (`media-sync-manager web`) needs no config of its own — it reuses the
# `jellyfin:` block above. Bind address and port are CLI flags (--host/--port, default 0.0.0.0:8087)
# rather than config, because in Docker the effective control is the compose `ports:` mapping.
