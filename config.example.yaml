poll_interval_seconds: 45

jellyfin:
  url: http://jellyfin.example.com:8096
  api_key: "${JELLYFIN_API_KEY}"      # env-expanded; commit-safe YAML
  user_id: "a1b2c3..."                # REQUIRED by the playlist-items endpoint

tdarr:
  url: http://tdarr.example.com:8265
  username: "${TDARR_USER}"           # omit username+password if the instance has auth disabled
  password: "${TDARR_PASS}"
  request_timeout_seconds: 20
  submit_timeout_seconds: 21600       # 6h: input link present this long with no output -> status flags it
  # scan_mode is auto-detected by `doctor` (scanFolderWatcher vs scanFindNew), not set here

media_root: /mnt/pool/media           # glue-view root; defines source_rel + relkey
path_maps:                            # jellyfin-view -> glue-view (longest prefix wins)
  - { from: /data/media, to: /mnt/pool/media }
tdarr_path_maps:                      # glue-view -> tdarr-view (omit if co-located)
  - { from: /mnt/pool/tdarr, to: /mnt/tdarr }

# Each target maps ONE Jellyfin playlist to ONE quality segment + output folder + Tdarr library.
# Which playlist you drop an item into decides its transcode flow (segment) - no genre guessing.
# Targets that share an output_dir are one device (its "2D Animation" + "Standard" playlists both
# land in that folder, under animation/ and standard/ subfolders).
targets:
  - playlist_name: "2D Animation"     # matched client-side by Name
    segment: animation                # -> input_dir/animation/... ; flow branches on this
    output_dir: /mnt/smb/togo/iphone  # Tdarr flow writes here; glue reads it for done/orphan diff
    library_id: lib_iphone            # the device's Tdarr library (shared flow)
    input_dir: /mnt/pool/tdarr/in/iphone
  - playlist_name: "Standard"
    segment: standard
    output_dir: /mnt/smb/togo/iphone
    library_id: lib_iphone
    input_dir: /mnt/pool/tdarr/in/iphone
  # A second device is just more targets with a different output_dir (+ its own library/input):
  # - { playlist_name: "iPad 2D Animation", segment: animation, output_dir: /mnt/smb/togo/ipad,
  #     library_id: lib_ipad, input_dir: /mnt/pool/tdarr/in/ipad }
  # - { playlist_name: "iPad Standard", segment: standard, output_dir: /mnt/smb/togo/ipad,
  #     library_id: lib_ipad, input_dir: /mnt/pool/tdarr/in/ipad }
